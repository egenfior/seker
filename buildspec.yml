version: 0.2

env:
  variables:
    IMAGE_TAG: "latest"

phases:
  pre_build:
    commands:
      - "set -e"
      - "echo AWS Region: $AWS_REGION"
      - "echo ECR Repo: $ECR_REPO"
      - "aws ecr get-login-password --region \"$AWS_REGION\" | docker login --username AWS --password-stdin \"${ECR_REPO%/*}\""

  build:
    commands:
      - "set -e"
      - "echo Repo root:"
      - "ls -la"
      - "echo Dockerfiles found:"
      - "find . -maxdepth 4 -type f -name Dockerfile -print"
      - |
        set -e
        DOCKERFILE="$(find . -maxdepth 4 -type f -name Dockerfile | head -n 1)"
        if [ -z "$DOCKERFILE" ]; then
          echo "ERROR: No Dockerfile found."
          exit 1
        fi
        CONTEXT="$(dirname "$DOCKERFILE")"
        echo "Using Dockerfile: $DOCKERFILE"
        echo "Using context: $CONTEXT"
        docker build -t seker-web -f "$DOCKERFILE" "$CONTEXT"
      - "docker tag seker-web:latest \"$ECR_REPO:$IMAGE_TAG\""

  post_build:
    commands:
      - "set -e"
      - "docker push \"$ECR_REPO:$IMAGE_TAG\""
      - "echo Pushed: $ECR_REPO:$IMAGE_TAG"
